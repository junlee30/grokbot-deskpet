<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!--
    Desk Pet menu bar icon: a macOS TEMPLATE image (black + alpha only; macOS tints it for light,
    dark and highlighted menu bars). The app icon's pup, simplified for 18 pt: a head with eye
    cut-outs, floppy ears split off by a gap, peeking over the desk.
    Rendered at 18 px (@1x) and 36 px (@2x) by scripts/build-icons.sh.
  -->
  <defs>
    <mask id="ears" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <ellipse cx="18" cy="16.4" rx="10.9" ry="10.4" fill="#000"/>
    </mask>
    <mask id="face" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <rect x="12.9" y="11.6" width="3.2" height="6.6" rx="1.6" fill="#000" transform="rotate(-14 14.5 14.9)"/>
      <rect x="19.9" y="11.6" width="3.2" height="6.6" rx="1.6" fill="#000" transform="rotate(-14 21.5 14.9)"/>
      <rect x="0" y="25" width="36" height="11" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#ears)">
    <path d="M10.4 7.6 C 5.6 6.8 2.4 10.2 2.4 15.4 C 2.4 20.4 4 23.8 6.6 23.4 C 8.6 23.1 9.2 20.6 9.8 17 Z"/>
    <path d="M25.6 7.6 C 30.4 6.8 33.6 10.2 33.6 15.4 C 33.6 20.4 32 23.8 29.4 23.4 C 27.4 23.1 26.8 20.6 26.2 17 Z"/>
  </g>
  <ellipse mask="url(#face)" cx="18" cy="16.4" rx="9.4" ry="9"/>
  <!-- desk -->
  <rect x="2" y="27" width="32" height="5" rx="2.5"/>
</svg>

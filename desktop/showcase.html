<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Pet · showcase (dev only)</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Dev-only scene for the README images and the social preview (npm run dev →
         /showcase.html?mode=hero|social|gif). Not part of the build. Jarvis shows Grok Bot's
         default avatar (captioned as Grok Bot's art in the README); the rest are robots. */
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
      }
      .scene {
        position: relative;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 15% 10%, #ffd9b8 0%, transparent 60%),
          radial-gradient(900px 700px at 90% 30%, #b9c9ff 0%, transparent 60%),
          radial-gradient(900px 600px at 50% 110%, #9fd8c9 0%, transparent 60%),
          linear-gradient(135deg, #f3e2d3, #cfd8f3);
      }
      .menubar {
        position: absolute;
        inset: 0 0 auto 0;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        padding: 0 14px;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(20px);
        font-size: 13px;
        color: #1d1d1f;
      }
      .menubar .tray {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 600;
      }
      .menubar .tray img {
        width: 18px;
        height: 18px;
      }
      .terminal {
        position: absolute;
        border-radius: 12px;
        background: rgba(28, 30, 36, 0.92);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        color: #c9d1d9;
        font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
        padding: 34px 18px 16px;
      }
      .terminal::before {
        content: "";
        position: absolute;
        top: 12px;
        left: 14px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff5f57;
        box-shadow: 16px 0 #febc2e, 32px 0 #28c840;
      }
      .terminal .dim {
        color: #6e7681;
      }
      .terminal .ok {
        color: #7ee787;
      }
      .note {
        position: absolute;
        width: 330px;
        display: flex;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(246, 246, 248, 0.82);
        backdrop-filter: blur(24px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        color: #1d1d1f;
        font-size: 13px;
        line-height: 1.35;
      }
      .note img {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        flex: none;
      }
      .note b {
        display: block;
        font-weight: 600;
      }
      .note .app {
        color: #6e6e73;
        font-size: 11px;
      }
      .petwin {
        position: absolute;
      }
      .title {
        position: absolute;
        color: #1d1d1f;
      }
      .title h1 {
        margin: 0;
        font-size: 64px;
        letter-spacing: -1.5px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .title h1 img {
        width: 76px;
        height: 76px;
        border-radius: 17px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      .title p {
        margin: 14px 0 0;
        font-size: 26px;
        line-height: 1.3;
        color: #3a3a3c;
        max-width: 560px;
      }
      .title .small {
        margin-top: 18px;
        font-size: 16px;
        color: #6e6e73;
      }
    </style>
  </head>
  <body>
    <div class="scene" id="scene"></div>
    <script type="module" src="/src/showcase.ts"></script>
  </body>
</html>

[package]
name = "grokbot-deskpet"
version = "0.3.0"
description = "Desk Pet, for Grok Bot (unofficial; not affiliated with xAI)"
license = "Apache-2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros"] }
# TLS via the OS (Security.framework on macOS); streaming bodies for SSE.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "json"] }
# v2 pairing in the macOS Keychain.
keyring = { version = "3", features = ["apple-native"] }
chacha20poly1305 = "0.11.0"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tauri-plugin-notification = "2"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# "Is Grok Bot installed?" (NSWorkspace URLForApplicationToOpenURL:) before a pet click opens it.
# Already built for tauri; only the NSWorkspace / NSURL bindings are named here.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[dev-dependencies]
# The opener plugin's own URL matcher, to test capabilities/pets.json.
glob = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net"] }

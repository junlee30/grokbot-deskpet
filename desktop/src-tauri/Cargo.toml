[package]
name = "grokbot-deskpet"
version = "0.2.0"
description = "Desk Pet for Grok Bot (unofficial, working title)"
license = "Apache-2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros"] }
# TLS via the OS (Security.framework on macOS); streaming bodies for SSE.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "json"] }
# Relay token in the macOS Keychain.
keyring = { version = "3", features = ["apple-native"] }

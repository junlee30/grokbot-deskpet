<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Pet · UI preview (dev only)</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Dev-only gallery (npm run dev → /preview.html). Not part of the build. */
      html,
      body {
        overflow: auto;
        height: auto;
        background: var(--desk, #e8e5de);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --desk: #1b1d22;
        }
      }
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px;
      }
      .win {
        position: relative;
        outline: 1px dashed rgba(128, 128, 128, 0.35);
      }
      .cap {
        font: 11px/1.3 -apple-system, system-ui, sans-serif;
        color: rgba(128, 128, 128, 0.9);
        margin-top: 4px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="gallery" id="gallery"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>

# NOT DEPLOYED. Deploying requires Jun's explicit approval.
#
# A future, standalone Fly app for the Desk Pet relay, separate from jarvis-scheduler: its own
# app, its own volume, its own secrets. Never copy or share secrets with any other app.
# Nothing in this repo runs `fly`. The exact, reviewed command list is in .runs/m1-deploy-plan.md.
#
# Single machine only, because state lives in SQLite on one volume:
#   fly deploy --app grokbot-deskpet-relay --ha=false        (run from relay/)
# Secrets (set by Jun, value generated inline, never displayed):
#   DESKPET_PEPPER (>= 32 chars; the relay refuses to start in production without it)
app = "grokbot-deskpet-relay"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  DESKPET_DB = "/data/deskpet.sqlite"
  DESKPET_PUBLIC_URL = "https://grokbot-deskpet-relay.fly.dev"
  # Fly's proxy sets Fly-Client-IP; trust it for per-IP pairing limits.
  DESKPET_TRUST_PROXY = "1"
  # CORS stays OFF in production (DESKPET_CORS_ORIGINS unset): the desktop app talks to the
  # relay from Rust, not from the webview.

[mounts]
  source = "deskpet_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Machines stop when idle and start on the next request. Note: an open SSE stream from a
  # running desktop pet counts as traffic, so in practice the machine stays awake while any
  # pet is connected.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

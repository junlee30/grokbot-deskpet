# EXAMPLE ONLY: the v1 relay is deprecated (see README.md). Nothing in this repo deploys it, and
# the project's own hosted relay has been shut down.
#
# For self-hosters who want to run their own relay on Fly.io: replace `your-deskpet-relay` with
# your own app name (here and in DESKPET_PUBLIC_URL), create the volume, and set one secret:
#   DESKPET_PEPPER (>= 32 random chars; the relay refuses to start in production without it)
# Single machine only, because state lives in SQLite on one volume (deploy with --ha=false).
app = "your-deskpet-relay"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  DESKPET_DB = "/data/deskpet.sqlite"
  DESKPET_PUBLIC_URL = "https://your-deskpet-relay.fly.dev"
  # Fly's proxy sets Fly-Client-IP; trust it for per-IP pairing limits.
  DESKPET_TRUST_PROXY = "1"
  # CORS stays OFF in production (DESKPET_CORS_ORIGINS unset): the desktop app talks to the
  # relay from Rust, not from the webview.

[mounts]
  source = "deskpet_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Machines stop when idle and start on the next request. Note: an open SSE stream from a
  # running desktop pet counts as traffic, so in practice the machine stays awake while any
  # pet is connected.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
